<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>다나의 오락실</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#13261F">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="다나의 오락실">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6EFEA; --paper:#F7FBF8; --ink:#13261F; --soft:#4F6A5F; --line:#C9DAD1;
  --cobalt:#2F5BFF; --sun:#F2B300; --mint:#12A58F; --plum:#7C5CFF; --coral:#F26A35;
  --shelf:#13261F; --shadow:rgba(19,38,31,.18);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1E19; --paper:#17302A; --ink:#E9F5EF; --soft:#9BB8AC; --line:#2A463D;
    --cobalt:#7C97FF; --sun:#FFD25C; --mint:#6EE7C8; --plum:#B8A1FF; --coral:#FFB38A;
    --shelf:#E9F5EF; --shadow:rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1E19; --paper:#17302A; --ink:#E9F5EF; --soft:#9BB8AC; --line:#2A463D;
  --cobalt:#7C97FF; --sun:#FFD25C; --mint:#6EE7C8; --plum:#B8A1FF; --coral:#FFB38A;
  --shelf:#E9F5EF; --shadow:rgba(0,0,0,.4);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Gowun Dodum",system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6}
.wrap{max-width:68rem;margin:0 auto;padding:clamp(2rem,6vw,4.5rem) clamp(1rem,4vw,2.5rem) 3rem}
h1,h2,h3,.btn,.count{font-family:"Jua","Gowun Dodum",system-ui,sans-serif;font-weight:400}

/* 머리말 */
header{display:grid;gap:1rem;margin-bottom:clamp(2rem,5vw,3.5rem)}
h1{font-size:clamp(3rem,11vw,6.5rem);line-height:.95;margin:0;letter-spacing:-.02em}
h1 .row{display:block}
h1 .row + .row{padding-left:clamp(1.5rem,8vw,6rem)}
.intro{font-size:clamp(1.05rem,2.4vw,1.25rem);max-width:30em;margin:0;color:var(--soft)}
.count{display:inline-flex;align-items:center;gap:.5rem;font-size:1.1rem;color:var(--ink)}
.count i{width:.7rem;height:.7rem;border-radius:50%;background:var(--mint);display:block}

/* 선반 */
.shelf-title{font-size:1.4rem;margin:0 0 1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,19rem),1fr));gap:clamp(1rem,3vw,1.75rem);align-items:start}

/* 게임 카트리지 */
.cart{background:var(--paper);border-radius:22px 22px 14px 14px;box-shadow:0 10px 0 -4px var(--shelf),0 18px 30px -18px var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.cover{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--cover-bg,#141633)}
.notch{height:10px;background:var(--accent);opacity:.9}
.body{padding:1.1rem 1.25rem 1.3rem;display:flex;flex-direction:column;gap:.7rem}
.cart h3{font-size:1.65rem;margin:0;line-height:1.1}
.cart p{margin:0;color:var(--soft)}
.tags{display:flex;flex-wrap:wrap;gap:.4rem;list-style:none;margin:0;padding:0}
.tags li{font-size:.85rem;padding:.15rem .65rem;border-radius:999px;border:1.5px solid var(--line);color:var(--soft)}
.meta{font-size:.85rem;color:var(--soft)}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:.5rem;font-size:1.25rem;padding:.65rem 1.4rem;border-radius:999px;background:var(--ink);color:var(--bg);text-decoration:none;align-self:flex-start;margin-top:.2rem}
.btn{border:none;cursor:pointer}
.install-hint{margin:0;color:var(--soft);max-width:30em}
.btn:hover{background:var(--accent);color:#13261F}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* 다음 게임 자리 */
.slot{border:2.5px dashed var(--line);border-radius:22px;min-height:20rem;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.6rem;padding:2rem 1.5rem;color:var(--soft)}
.slot h3{font-size:1.5rem;margin:0;color:var(--ink)}
.slot p{margin:0;max-width:16em}
.slot .plus{width:3.2rem;height:3.2rem;border-radius:50%;border:2.5px dashed var(--line);display:grid;place-items:center;font-family:"Jua",sans-serif;font-size:1.8rem;line-height:1}

/* 방울 박자 표지: 떨어지는 방울 */
.bubble-cover{--cover-bg:#0A0A1C}
.bubble-cover .lane{position:absolute;top:0;bottom:0;width:18%;border-radius:999px;background:#16163A}
.bubble-cover .lane:nth-child(1){left:9%}.bubble-cover .lane:nth-child(2){left:30%}
.bubble-cover .lane:nth-child(3){left:52%}.bubble-cover .lane:nth-child(4){left:73%}
.bubble-cover .hit{position:absolute;left:0;right:0;top:76%;height:2px;background:rgba(243,238,255,.18)}
.bubble-cover .ring{position:absolute;top:76%;width:12%;aspect-ratio:1;border-radius:50%;border:3px solid var(--c);transform:translate(-50%,-50%)}
.bubble-cover .drop{position:absolute;top:-14%;width:11%;aspect-ratio:1;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c);transform:translateX(-50%);animation:fall var(--dur,2.4s) linear infinite;animation-delay:var(--delay,0s)}
.bubble-cover .drop::after{content:"";position:absolute;left:20%;top:18%;width:28%;height:28%;border-radius:50%;background:#fff;opacity:.4}
@keyframes fall{0%{top:-14%;opacity:1}76%{top:70%;opacity:1;transform:translateX(-50%) scale(1)}84%{top:70%;opacity:0;transform:translateX(-50%) scale(1.6)}100%{top:70%;opacity:0}}
.bubble-cover .title{position:absolute;left:1rem;bottom:.8rem;font-family:"Jua",sans-serif;font-size:1.4rem;color:#F3EEFF}
@media (prefers-reduced-motion:reduce){
  .bubble-cover .drop{animation:none}
  .bubble-cover .drop:nth-of-type(odd){top:30%}
  .bubble-cover .drop:nth-of-type(even){top:52%}
}

/* 반짝 지렁이 표지 */
.worm-cover{--cover-bg:#0B0E12}
.worm-cover svg{position:absolute;inset:0;width:100%;height:100%}
.worm-cover .title{position:absolute;left:1rem;bottom:.8rem;font-family:"Jua",sans-serif;font-size:1.4rem;color:#F3FFF9}

footer{margin-top:3.5rem;padding-top:1.5rem;border-top:1.5px solid var(--line);color:var(--soft);font-size:.9rem}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="row">다나의</span><span class="row">오락실</span></h1>
    <span class="count"><i aria-hidden="true"></i><span id="count"></span></span>
    <button class="btn" id="installBtn" type="button" hidden style="--accent:var(--sun)">앱으로 설치하기</button>
    <p class="install-hint" id="iosHint" hidden>아이폰이나 아이패드에서는 사파리의 공유 버튼(네모에서 화살표가 위로 나온 모양)을 누르고 ‘홈 화면에 추가’를 고르면 앱으로 설치돼요. 아이폰은 화면 아래쪽, 아이패드는 주소창 오른쪽에 공유 버튼이 있어요.</p>
  </header>

  <main>
    <h2 class="shelf-title">게임 선반</h2>
    <div class="grid" id="grid"></div>
  </main>

  <footer>
    앱으로 설치하면 인터넷이 없어도 플레이할 수 있어요. 게임 기록은 이 기기에 저장돼요. <span style="opacity:.6">(버전 75)</span>
  </footer>
</div>

<script>
/* 게임 목록: 새 게임을 만들면 여기에 하나씩 추가돼요 */
const GAMES = [
  {
    title: '방울 박자',
    desc: '떨어지는 방울이 동그라미에 겹치는 순간 키를 누르는 리듬게임이에요. 클래식 명곡, 민요, 캐롤을 포함한 28곡이 있고, 내 음악 파일로 직접 곡을 만들 수도 있어요.',
    tags: ['리듬', '클래식', '내 곡 만들기', '랭킹'],
    url: 'games/bangul-bakja.html',
    accent: '#FF5CAA',
    cover: 'bubble',
    made: '2026년 10월 28일',
  },
  {
    title: '반짝 지렁이',
    desc: '반짝이는 알갱이를 먹고 길어지는 지렁이 게임이에요. 다른 지렁이를 내 몸에 부딪히게 하면 알갱이로 흩어지고, 그걸 먹으면 쑥 자라요. 스킨 7개와 난이도 3단계가 있어요.',
    tags: ['아케이드', '스킨', '조이스틱', '순위'],
    url: 'games/banjjak-jireongi.html',
    accent: '#FFD23F',
    cover: 'worm',
    made: '2026년 11월 2일',
  },
];

const covers = {
  worm: g => {
    // 반짝 지렁이 표지: 정해진 길을 도는 가벼운 반복 애니메이션 (서로 부딪히지 않는 길 두 개)
    const ring = (cx, cy, R0, A, k, n, dir, ph) => {
      const P = [];
      for (let i = 0; i < n; i++) { const t = dir * i / n * Math.PI * 2 + ph, r = R0 + A * Math.sin(k * t); P.push([cx + Math.cos(t) * r, cy + Math.sin(t) * r * .97]); }
      const f = v => v.toFixed(2);
      let d = `M${f(P[0][0])} ${f(P[0][1])}`;
      for (let i = 0; i < n; i++) {
        const p0 = P[(i - 1 + n) % n], p1 = P[i], p2 = P[(i + 1) % n], p3 = P[(i + 2) % n];
        d += `C${f(p1[0] + (p2[0] - p0[0]) / 6)} ${f(p1[1] + (p2[1] - p0[1]) / 6)} ${f(p2[0] - (p3[0] - p1[0]) / 6)} ${f(p2[1] - (p3[1] - p1[1]) / 6)} ${f(p2[0])} ${f(p2[1])}`;
      }
      return d + 'Z';
    };
    const len = d => {
      const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); document.body.appendChild(s);
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('d', d); s.appendChild(p);
      const L = p.getTotalLength(); s.remove(); return L;
    };
    const SPEED = 9, outer = ring(60, 45, 31, 2.6, 6, 48, 1, 0), inner = ring(60, 45, 13, 1.8, 4, 32, -1, .4);
    const Do = len(outer) / SPEED, Di = len(inner) / SPEED;
    const stripe = h => i => Math.floor(i / 3) % 2 ? `hsl(${h},80%,70%)` : `hsl(${h},85%,58%)`;
    const worms = [
      { p: 'o', D: Do, off: 0, r: 2.5, n: 13, col: stripe(24), edge: 'hsl(24,70%,28%)' },
      { p: 'o', D: Do, off: Do / 3, r: 2.1, n: 11, col: stripe(265), edge: 'hsl(265,60%,30%)' },
      { p: 'o', D: Do, off: 2 * Do / 3, r: 2.3, n: 12, col: stripe(150), edge: 'hsl(150,60%,22%)' },
      { p: 'i', D: Di, off: 0, r: 2.8, n: 15, col: (i, n) => `hsl(${Math.round(i / n * 300)},90%,62%)`, edge: 'rgba(20,20,30,.6)' },
    ];
    const mot = (D, b, p, rot) => `<animateMotion dur="${D.toFixed(2)}s" repeatCount="indefinite" begin="${b.toFixed(2)}s"${rot ? ' rotate="auto"' : ''}><mpath href="#wormP${p}"/></animateMotion>`;
    let body = '';
    for (const w of worms) {
      const dl = w.r * .8 / SPEED, bt = i => -w.off + i * dl - w.D * 2;
      let e = '', f = '';
      for (let i = w.n - 1; i >= 0; i--) {
        e += `<circle r="${(w.r + .45).toFixed(2)}" fill="${w.edge}">${mot(w.D, bt(i), w.p)}</circle>`;
        if (i) f += `<circle r="${w.r}" fill="${w.col(i, w.n)}">${mot(w.D, bt(i), w.p)}</circle>`;
      }
      const r = w.r, q = v => (v * r).toFixed(2);
      f += `<g><circle r="${r}" fill="${w.col(0, w.n)}"/><circle cx="${q(.35)}" cy="${q(.45)}" r="${q(.36)}" fill="#fff"/><circle cx="${q(.35)}" cy="${q(-.45)}" r="${q(.36)}" fill="#fff"/><circle cx="${q(.49)}" cy="${q(.45)}" r="${q(.19)}" fill="#10141A"/><circle cx="${q(.49)}" cy="${q(-.45)}" r="${q(.19)}" fill="#10141A"/>${mot(w.D, bt(0), w.p, 1)}</g>`;
      body += e + f;
    }
    let pel = '', seed = 7, cnt = 0;
    const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647, hues = [330, 200, 45, 120, 280, 20, 170];
    for (const [a, b, m] of [[4, 10, 4], [19, 25, 12], [37, 39.5, 10]]) for (let i = 0; i < m; i++) {
      const t = rnd() * Math.PI * 2, r = a + rnd() * (b - a), s = .7 + rnd() * .6, h = hues[cnt++ % 7];
      pel += `<g transform="translate(${(60 + Math.cos(t) * r).toFixed(1)} ${(45 + Math.sin(t) * r * .97).toFixed(1)})"><circle r="${(2.2 * s).toFixed(2)}" fill="hsl(${h},100%,62%)" opacity=".22"><animate attributeName="opacity" values=".12;.3;.12" dur="${(2 + s).toFixed(1)}s" repeatCount="indefinite"/></circle><circle r="${(.85 * s).toFixed(2)}" fill="hsl(${h},100%,72%)"/></g>`;
    }
    return `<div class="cover worm-cover" aria-hidden="true">
      <svg viewBox="0 0 120 90" preserveAspectRatio="xMidYMid slice">
        <defs><pattern id="wormHex" width="10.39" height="18" patternUnits="userSpaceOnUse"><rect width="10.39" height="18" fill="#0B0E12"/><path d="M5.2 .8 9.6 3.3v5.1L5.2 10.9.8 8.4V3.3Z M0 9.8 4.4 12.3v5.1L0 19.9M10.39 9.8 5.99 12.3v5.1l4.4 2.5" fill="#171D24"/></pattern><path id="wormPo" d="${outer}"/><path id="wormPi" d="${inner}"/></defs>
        <rect width="120" height="90" fill="url(#wormHex)"/>
        <path d="M0 0H120V90H0Z M60 4A41 40 0 1 0 60.01 4Z" fill="rgba(110,18,36,.45)" fill-rule="evenodd"/>
        <ellipse cx="60" cy="44" rx="41" ry="40" fill="none" stroke="rgba(255,80,110,.75)" stroke-width=".6"/>
        ${pel}${body}
      </svg>
      <span class="title">${g.title}</span>
    </div>`;
  },
  bubble: g => {
    const cols = ['#FF5CAA', '#46D6FF', '#FF9650', '#FFDE5A'];   // 게임 속 방울 색
    const lanes = [18, 39, 61, 82];
    const drops = [[0, 0, 2.4], [1, .6, 2.4], [2, 1.2, 2.4], [3, 1.8, 2.4], [2, .3, 2.4], [0, 1.5, 2.4]];
    return `<div class="cover bubble-cover" aria-hidden="true">
      <div class="lane"></div><div class="lane"></div><div class="lane"></div><div class="lane"></div>
      <div class="hit"></div>
      ${lanes.map((x, i) => `<div class="ring" style="left:${x}%;--c:${cols[i]}"></div>`).join('')}
      ${drops.map(([l, d, dur]) => `<div class="drop" style="left:${lanes[l]}%;--c:${cols[l]};--delay:-${d}s;--dur:${dur}s"></div>`).join('')}
      <span class="title">${g.title}</span>
    </div>`;
  },
};

const grid = document.getElementById('grid');
grid.innerHTML = GAMES.map(g => `
  <article class="cart" style="--accent:${g.accent}">
    ${(covers[g.cover] || (() => `<div class="cover"></div>`))(g)}
    <div class="notch"></div>
    <div class="body">
      <h3>${g.title}</h3>
      <p>${g.desc}</p>
      <ul class="tags">${g.tags.map(t => `<li>${t}</li>`).join('')}</ul>
      <span class="meta">만든 날: ${g.made}</span>
      <a class="btn" href="${g.url}">플레이하기</a>
    </div>
  </article>`).join('') + `
  <div class="slot">
    <span class="plus" aria-hidden="true">+</span>
    <h3>다음 게임 자리</h3>
    <p>새 게임을 만들면 이 선반에 하나씩 채워져요.</p>
  </div>`;
document.getElementById('count').textContent = `지금까지 만든 게임 ${GAMES.length}개`;
// 움직임 줄이기를 켠 기기에서는 지렁이 표지를 멈춰 둬요
if (matchMedia('(prefers-reduced-motion: reduce)').matches) document.querySelectorAll('.worm-cover svg').forEach(v => v.pauseAnimations && v.pauseAnimations());

/* 앱 설치 */
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
let deferred = null;
const installBtn = document.getElementById('installBtn');
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; if (!standalone) installBtn.hidden = false; });
installBtn.addEventListener('click', async () => {
  if (!deferred) return;
  deferred.prompt(); await deferred.userChoice; deferred = null; installBtn.hidden = true;
});
addEventListener('appinstalled', () => { installBtn.hidden = true; });
// 아이패드는 자신을 맥으로 소개해서, 터치 화면인 맥이면 아이패드로 봐요
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
if (isIOS && !standalone) document.getElementById('iosHint').hidden = false;
if ('serviceWorker' in navigator){
  const hadSW = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(reg => reg.update()).catch(() => {});
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadSW && !reloaded){ reloaded = true; location.reload(); } });
}
</script>
</body>
</html>
